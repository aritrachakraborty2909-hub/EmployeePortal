<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h2>Employee Registration Portal</h2>
        <form action="process.php" method="POST">
            <div class="form-group">
                <label for="emp_name">Full Name <span class="required-asterisk">*</span></label>
                <input type="text" id="emp_name" name="emp_name" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="emp_id">Employee ID</label>
                <input type="text" id="emp_id" name="emp_id" placeholder="EMP12345">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number <span class="required-asterisk">*</span></label>
                <input type="tel" id="phone" name="phone" placeholder="+1234567890" required>
            </div>

            <div class="form-group">
                <label for="department">Department</label>
                <input type="text" id="department" name="department" placeholder="Engineering">
            </div>

            <button type="submit" class="submit-btn">Register Employee</button>
        </form>
    </div>
</body>
</html>
